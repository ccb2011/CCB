      <circle cx="527" cy="188" r="5" fill="url(#brass)" stroke-width="1.5"/>
    </g>
    <g fill="url(#shade)" stroke="#d2cec2" stroke-opacity=".62" stroke-width="1.8">
      <path d="M196 677h328l-20 24H216z"/><path d="M221 653h278l25 24H196z"/><path d="M242 638h236l21 15H221z"/>

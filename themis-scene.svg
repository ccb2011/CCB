  <style>
    .statue{transform-box:view-box;transform-origin:360px 380px;animation:still 10s ease-in-out infinite}
    .wings{transform-box:view-box;transform-origin:360px 300px;animation:wing-glow 12s ease-in-out infinite}
    .scales{transform-box:view-box;transform-origin:527px 198px;animation:balance 7s ease-in-out infinite}
    .glint{animation:shine 7s ease-in-out infinite}
    @keyframes still{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
    @keyframes wing-glow{0%,100%{opacity:.86}50%{opacity:1}}
    @keyframes balance{0%,100%{transform:rotate(0)}50%{transform:rotate(1deg)}}
    @keyframes shine{0%,70%,100%{opacity:.1}76%{opacity:1}83%{opacity:.2}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}
  </style>
</svg>

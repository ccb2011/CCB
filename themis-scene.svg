<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Стоящая статуя Фемиды</title>
  <desc id="desc">Минималистичная мраморная Фемида с поднятой повязкой, крыльями, мечом и весами.</desc>
  <defs>
    <radialGradient id="halo"><stop stop-color="#d6c49c" stop-opacity=".14"/><stop offset="1" stop-color="#d6c49c" stop-opacity="0"/></radialGradient>
    <linearGradient id="stone" x1=".18" y1="0" x2=".82" y2="1"><stop stop-color="#e6e1d5"/><stop offset=".52" stop-color="#aaa89f"/><stop offset="1" stop-color="#666861"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#aaa89f"/><stop offset="1" stop-color="#41443f"/></linearGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1deb0"/><stop offset=".48" stop-color="#b79a62"/><stop offset="1" stop-color="#76603b"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <ellipse cx="360" cy="365" rx="330" ry="350" fill="url(#halo)"/>
  <circle cx="360" cy="365" r="286" stroke="#c0a36b" stroke-opacity=".16" stroke-width="1"/>
  <path d="M80 672h560" stroke="#c0a36b" stroke-opacity=".2"/>
  <g class="statue">
    <g class="wings" fill="url(#shade)" stroke="url(#stone)" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5">
      <path d="M319 307c-57-51-122-82-211-79 40 15 78 39 111 68-46-12-83-10-124 5 58 13 110 43 157 88 16-33 38-59 67-82Z" opacity=".73"/>
      <path d="M401 307c57-51 122-82 211-79-40 15-78 39-111 68 46-12 83-10 124 5-58 13-110 43-157 88-16-33-38-59-67-82Z" opacity=".73"/>
      <path d="M126 239c61 15 111 41 153 78m-132-42c48 14 87 38 118 68m-89-43c39 13 69 32 95 55m353-116c-61 15-111 41-153 78m132-42c-48 14-87 38-118 68m89-43c-39 13-69 32-95 55" fill="none" stroke-width="1.8" opacity=".8"/>
    </g>
    <g class="robe" stroke="url(#stone)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M315 276c-22 17-36 43-39 81l-8 107c-5 69-24 126-60 183l-15 24h334l-24-36c-33-50-48-104-48-170V356c0-39-15-67-41-82-27 20-72 22-99 2Z" fill="url(#shade)" stroke-width="3"/>
      <path d="M314 292c-10 47-8 93 8 135l-20 222m77-357c29 51 38 102 24 153l31 204m-132-203c34 17 70 21 108 10m-118 50c42 16 83 17 125 4m-143 54c47 15 94 12 142-5m-162 50c55 14 110 7 164-15" stroke-width="2" opacity=".72"/>
      <path d="M304 296c27 22 60 32 99 27m-111 24c23 25 49 39 79 45" stroke-width="2" opacity=".62"/>
      <path d="M304 296c-23 13-43 31-62 54m158-57c22 16 41 39 56 67" stroke-width="10"/>
    </g>
    <g class="head" stroke="url(#stone)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M320 174c-3-38 17-65 48-68 34-4 59 21 57 59-2 37-22 63-54 65-29 2-48-20-51-56Z" fill="url(#stone)" stroke-width="2.5"/>
      <path d="M320 161c-13-14-10-31 1-41m2-6c0-21 14-35 31-38m8-5c10-17 30-21 44-10m12 5c19 2 29 17 27 36m-2 11c14 13 13 29 2 41" stroke-width="4"/>
      <path d="M315 149c28 8 72 8 119-3l5 21c-39 11-87 14-121 6Z" fill="url(#brass)" stroke-width="1.4"/>
    </g>
    <g class="sword" stroke="url(#brass)" stroke-linecap="round" stroke-linejoin="round">
      <path d="m155 37 17 6 52 110-15 8-54-111Z" fill="url(#stone)" stroke-width="1.5"/>
      <path d="m198 149 35 17m-25-12 13 25" stroke-width="4"/>
      <circle cx="203" cy="151" r="4" fill="url(#brass)" stroke-width="1"/>
      <path d="m163 50 52 108" stroke="#fff1d1" stroke-width="1.4" opacity=".42"/>
      <path class="glint" d="m150 45 4-13 10 13" stroke="#fff8e3" stroke-width="2.2" filter="url(#glow)"/>
    </g>
    <g class="arm" stroke="url(#stone)" stroke-linecap="round" stroke-linejoin="round">
      <path d="M322 293c-22 4-39 1-55-13l-36-90m201 91c25-5 46-18 66-36l32-25" stroke-width="17"/>
